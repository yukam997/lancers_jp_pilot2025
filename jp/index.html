<!DOCTYPE html>
<html>

<head>
    <title>Modifier Fill-in Experiment</title>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://unpkg.com/jspsych@7.3.1/css/jspsych.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/jspsych@7.3.1"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="stimuli.js"></script>
    <link href="styles.css" rel="stylesheet" type="text/css" />
</head>

<body></body>

<script>
    var jsPsych = initJsPsych({
        show_progress_bar: true,
        auto_update_progress_bar: true
    });

    // subject id, from URL param if present (e.g. Prolific), otherwise random
    var subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID');
    if (!subject_id) {
        subject_id = jsPsych.randomization.randomID(10);
    }
    jsPsych.data.addProperties({ subject_id: subject_id });

    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus:
            '<p class="stimulus">In this study, you will read short Japanese scenarios. ' +
            'Each one contains a blank, marked ＿＿＿, where a word or phrase has been removed.</p>' +
            '<p class="stimulus">Please read the scenario carefully and type as many words or phrases as you ' +
            'can think of that would naturally fill the blank, given the situation described. ' +
            'After typing each option, press Enter to add it as its own tag &mdash; ' +
            'you can add as few or as many as you like.</p>' +
            '<p class="stimulus">There are 24 scenarios in total. There are no right or wrong answers &mdash; ' +
            'we are interested in your intuitive judgment.</p>' +
            '<b>When you are ready to begin, press the start button.</b>',
        choices: ['Start'],
        margin_vertical: '20px'
    };

    // stimuliPool (from stimuli.js) contains every predicate x attitude x relationship
    // combination (6 x 6 x 4 = 144). Each participant sees exactly one scenario for
    // every (relationship, attitude) pair -- 4 x 6 = 24 scenarios -- with the predicate
    // for each pair chosen at random.
    var relationships = Array.from(new Set(stimuliPool.map(function (s) { return s.relationship; })));
    var attitudes = Array.from(new Set(stimuliPool.map(function (s) { return s.attitude; })));
    var predicates = Array.from(new Set(stimuliPool.map(function (s) { return s.predicate; })));

    var poolIndex = {};
    stimuliPool.forEach(function (s) {
        var key = s.relationship + '|' + s.attitude + '|' + s.predicate;
        poolIndex[key] = s;
    });

    var selected_stimuli = [];
    relationships.forEach(function (rel) {
        attitudes.forEach(function (att) {
            var pred = predicates[Math.floor(Math.random() * predicates.length)];
            var key = rel + '|' + att + '|' + pred;
            var s = poolIndex[key];
            if (s) {
                selected_stimuli.push(s);
            } else {
                console.warn('Missing stimulus for', key);
            }
        });
    });

    var shuffled_stimuli = jsPsych.randomization.shuffle(selected_stimuli);

    console.log('shuffled_stimuli count:', shuffled_stimuli.length);
    console.log('shuffled_stimuli:', shuffled_stimuli);

    var trials = shuffled_stimuli.map(function (s) {
        var sentence_with_blank = s.text.replace('[modifier]', '<span class="blank">＿＿＿</span>');
        var collected_tags = [];
        var feedback_text = '';

        var trial_html =
            '<p class="stimulus">' + sentence_with_blank + '</p>' +
            '<p>上の＿＿＿に入る言葉を入力し、Enterキーを押してください。いくつでも追加できます。</p>' +
            '<div id="tag-container" class="tag-container"></div>' +
            '<input type="text" id="tag-input" class="tag-input" placeholder="言葉を入力してEnter" autocomplete="off">' +
            '<p class="feedback-label">（任意）このシナリオについてのフィードバックがあればご記入ください。</p>' +
            '<textarea id="feedback-box" class="feedback-box" rows="3" placeholder="コメント（任意）"></textarea>';

        return {
            type: jsPsychHtmlButtonResponse,
            stimulus: trial_html,
            choices: ['Continue'],
            data: {
                predicate: s.predicate,
                attitude: s.attitude,
                relationship: s.relationship,
                sentence: s.text
            },
            on_load: function () {
                var input = document.getElementById('tag-input');
                var container = document.getElementById('tag-container');
                var feedback_box = document.getElementById('feedback-box');
                var continue_btn = document.querySelector('.jspsych-btn');
                continue_btn.disabled = true;
                input.focus();

                // The trial's HTML is wiped from the page as soon as the response
                // is recorded, before on_finish runs. So we track the feedback text
                // live (on every keystroke) instead of reading the DOM at the end.
                feedback_box.addEventListener('input', function () {
                    feedback_text = feedback_box.value;
                });

                function render_tags() {
                    container.innerHTML = '';
                    collected_tags.forEach(function (tag, idx) {
                        var tag_el = document.createElement('span');
                        tag_el.className = 'tag-label';
                        tag_el.textContent = tag;

                        var remove_el = document.createElement('span');
                        remove_el.className = 'tag-remove';
                        remove_el.textContent = '×';
                        remove_el.addEventListener('click', function () {
                            collected_tags.splice(idx, 1);
                            render_tags();
                            continue_btn.disabled = collected_tags.length === 0;
                        });

                        tag_el.appendChild(remove_el);
                        container.appendChild(tag_el);
                    });
                }

                input.addEventListener('keydown', function (e) {
                    // Ignore Enter presses that are part of IME composition
                    // (e.g. confirming kanji conversion), not an actual submit.
                    if (e.isComposing || e.keyCode === 229) {
                        return;
                    }
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        var val = input.value.trim();
                        if (val.length > 0) {
                            collected_tags.push(val);
                            input.value = '';
                            render_tags();
                            continue_btn.disabled = false;
                        }
                    }
                });
            },
            on_finish: function (data) {
                data.modifier_response = collected_tags.join('; ');
                data.modifier_response_list = collected_tags.slice();
                data.trial_feedback = feedback_text.trim();
            }
        };
    });

    // ---- DataPipe config ----
    // Create a study at https://pipe.jspsych.org (backed by an OSF project) and paste
    // its experiment ID below. Leave as-is (or blank) to skip DataPipe and only use
    // the local CSV download.
    var datapipe_experiment_id = 'PASTE_YOUR_DATAPIPE_ID_HERE';

    function save_data_to_datapipe(filename, data_string) {
        if (!datapipe_experiment_id || datapipe_experiment_id === 'PASTE_YOUR_DATAPIPE_ID_HERE') {
            return Promise.resolve();
        }
        return fetch('https://pipe.jspsych.org/api/data/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                experimentID: datapipe_experiment_id,
                filename: filename,
                data: data_string
            })
        }).catch(function (err) {
            console.error('DataPipe save failed, falling back to local download only.', err);
        });
    }

    var debrief = {
        type: jsPsychSurveyHtmlForm,
        html: '<p>Thank you very much for your participation!<br><br>' +
            'Please let us know if you have any other comments.</p>' +
            '<textarea name="comments" rows="5" cols="50"></textarea>',
        button_label: 'Finish',
        on_finish: function () {
            var filename = 'modifier_experiment_' + subject_id + '.csv';
            var csv_data = jsPsych.data.get().csv();
            save_data_to_datapipe(filename, csv_data).finally(function () {
                // Always also trigger a local download as a backup, in case DataPipe
                // is unreachable or not yet configured.
                jsPsych.data.get().localSave('csv', filename);
            });
        }
    };

    var timeline = [instructions].concat(trials, [debrief]);

    jsPsych.run(timeline);
</script>

</html>
